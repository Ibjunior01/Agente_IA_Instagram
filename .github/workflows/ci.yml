name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: |
          python -m ruff check .

      - name: Run tests
        run: |
          python -m pytest -q

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t agente-ia-instagram:test .

      - name: Start container
        run: |
          docker run -d \
            --name agente-ia-instagram \
            -p 5000:5000 \
            -e API_KEY=test_api_key \
            -e GEMINI_API_KEY=test_gemini_key \
            agente-ia-instagram:test

      - name: Wait for API
        run: |
          for i in {1..15}; do
            if curl --fail http://127.0.0.1:5000/health; then
              exit 0
            fi

            sleep 2
          done

          echo "API did not become healthy"
          docker logs agente-ia-instagram
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop agente-ia-instagram || true
          docker rm agente-ia-instagram || true